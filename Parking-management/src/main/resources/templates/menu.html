<!-- templates/menu.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menú Estacionamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <h1 class="mb-4">Sistema de Gestión de Estacionamiento</h1>

    <div class="card mb-4">
        <div class="card-header">
            <h2>Registrar Vehículos</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/parking/register-official}" method="post" class="mb-3">
                <div class="input-group">
                    <input type="text" name="licensePlate" class="form-control" placeholder="Placa del vehículo oficial" required>
                    <button type="submit" class="btn btn-primary">Registrar Vehículo Oficial</button>
                </div>
            </form>

            <form th:action="@{/parking/register-resident}" method="post">
                <div class="input-group">
                    <input type="text" name="licensePlate" class="form-control" placeholder="Placa del vehículo residente" required>
                    <button type="submit" class="btn btn-primary">Registrar Vehículo Residente</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h2>Registrar Entradas/Salidas</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/parking/register-entry}" method="post" class="mb-3">
                <div class="input-group">
                    <input type="text" name="licensePlate" class="form-control" placeholder="Placa del vehículo" required>
                    <button type="submit" class="btn btn-success">Registrar Entrada</button>
                </div>
            </form>

            <form th:action="@{/parking/register-exit}" method="post">
                <div class="input-group">
                    <input type="text" name="licensePlate" class="form-control" placeholder="Placa del vehículo" required>
                    <button type="submit" class="btn btn-warning">Registrar Salida</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h2>Operaciones Mensuales</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/parking/start-month}" method="post" class="mb-3">
                <button type="submit" class="btn btn-danger">Iniciar Nuevo Mes</button>
            </form>

            <a th:href="@{/parking/generate-report}" class="btn btn-info">Generar Reporte de Residentes</a>
        </div>
    </div>
</div>
</body>
</html>
