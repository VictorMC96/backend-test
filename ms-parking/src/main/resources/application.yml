server:
  port: ${PORT:8080}
  servlet:
    context-path: /ms-parking

spring:
#  application:
#    name: ms-parking

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ms-parking
    username: sa
    password: ''

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        '[show_sql]': true
        '[use_sql_comments]': false
        '[format_sql]': false
        #'[event.merge.entity_copy_observer]': allow

    show-sql: true
    

parking:
  cost:
    minute: 0.5



springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
